  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #FF7A2F;
      --orange-light: #FF9A5C;
      --yellow: #FFD046;
      --yellow-pale: #FFF8E1;
      --mint: #4ECDC4;
      --mint-pale: #E8FAF9;
      --cream: #FFF9F0;
      --navy: #2D2A4A;
      --gray: #7B7B9A;
      --gray-light: #EEEEF5;
      --white: #FFFFFF;
      --radius: 16px;
      --shadow: 0 6px 28px rgba(255,122,47,0.14);
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Noto Sans KR', sans-serif; color: var(--navy); background: var(--white); line-height: 1.7; }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(14px);
      border-bottom: 2px solid var(--yellow-pale);

    .nav-inner { max-width: 1100px; margin: 0 auto; width: 100%; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon { width: 40px; height: 40px; background: var(--orange); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .logo-text { font-weight: 900; font-size: 18px; color: var(--navy); }
    .logo-text span { color: var(--orange); }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--gray); font-size: 14px; font-weight: 500; transition: color .2s; }
    .nav-links a:hover { color: var(--orange); }
    .nav-cta { background: var(--orange); color: white; border: none; padding: 10px 22px; border-radius: 24px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all .2s; box-shadow: 0 4px 14px rgba(255,122,47,0.35); }
    .nav-cta:hover { background: var(--orange-light); transform: translateY(-1px); }
    .hamburger { display: none; background: none; border: none; cursor: pointer; padding: 4px; }
    .hamburger span { display: block; width: 22px; height: 2.5px; background: var(--navy); margin: 5px 0; border-radius: 2px; }

    /* HERO */
    #home { min-height: 100vh; background: linear-gradient(160deg, #FFF3E0 0%, #FFFDE7 50%, #E8FAF9 100%); padding: 100px 24px 60px; display: flex; align-items: center; position: relative; overflow: hidden; }
    .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .35; pointer-events: none; }
    .blob.b1 { width: 400px; height: 400px; background: var(--yellow); top: -80px; right: -60px; }
    .blob.b2 { width: 300px; height: 300px; background: var(--mint); bottom: -60px; left: -40px; }
    .blob.b3 { width: 200px; height: 200px; background: var(--orange-light); top: 40%; left: 40%; }
    .hero-inner { max-width: 1100px; margin: 0 auto; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; position: relative; z-index: 1; }
    .hero-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--yellow); color: var(--navy); padding: 6px 16px; border-radius: 24px; font-size: 13px; font-weight: 700; margin-bottom: 20px; }
    .hero-title { font-size: clamp(28px, 4vw, 48px); font-weight: 900; line-height: 1.25; color: var(--navy); margin-bottom: 20px; }
    .hero-title em { color: var(--orange); font-style: normal; display: block; }
    .hero-desc { font-size: 15px; color: var(--gray); margin-bottom: 34px; max-width: 440px; }
    .hero-btns { display: flex; gap: 12px; flex-wrap: wrap; }

    .btn-primary:hover { background: var(--orange-light); transform: translateY(-2px); }
    .btn-secondary { background: white; color: var(--navy); padding: 14px 28px; border-radius: 28px; border: 2.5px solid var(--gray-light); font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .2s; text-decoration: none; display: inline-block; }
    .btn-secondary:hover { border-color: var(--orange); color: var(--orange); }
    .hero-stats { display: flex; gap: 24px; margin-top: 44px; padding-top: 36px; border-top: 2px dashed rgba(255,122,47,0.25); flex-wrap: wrap; }
    .stat-item { text-align: center; }
    .stat-num { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; color: var(--orange); }
    .stat-label { font-size: 11px; color: var(--gray); }
    .hero-visual { display: flex; justify-content: center; align-items: center; position: relative; }
    .dino-scene { width: 320px; height: 320px; position: relative; }
    .dino-circle { width: 300px; height: 300px; background: white; border-radius: 50%; position: absolute; top: 10px; left: 10px; box-shadow: 0 12px 48px rgba(255,122,47,0.18); display: flex; align-items: center; justify-content: center; font-size: 130px; animation: bounceDino 3s ease-in-out infinite; }

    .dino-badge { position: absolute; background: white; border-radius: 14px; padding: 10px 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.10); font-size: 13px; font-weight: 700; }
    .dino-badge.db1 { top: 0; right: -10px; animation: floatY 4s 0s ease-in-out infinite; }
    .dino-badge.db2 { bottom: 20px; left: -20px; animation: floatY 4s .8s ease-in-out infinite; }
    .dino-badge.db3 { top: 45%; right: -30px; animation: floatY 3.5s .4s ease-in-out infinite; }
    @keyframes floatY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

    /* SECTION BASE */
    section { padding: 88px 24px; }

    .sec-title { font-size: clamp(22px, 3vw, 34px); font-weight: 900; margin-bottom: 12px; }
    .sec-desc { font-size: 15px; color: var(--gray); max-width: 480px; margin: 0 auto; }
    .fade-in { opacity: 0; transform: translateY(22px); transition: opacity .55s, transform .55s; }
    .fade-in.visible { opacity: 1; transform: none; }

    /* ABOUT */
    #about { background: var(--cream); }
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
    .about-img-wrap { position: relative; }
    .about-img-box { background: linear-gradient(145deg, #FFE0B2, #FFCC80); border-radius: 24px; height: 360px; display: flex; align-items: center; justify-content: center; font-size: 160px; box-shadow: 0 12px 40px rgba(255,122,47,0.15); }
    .about-stamp { position: absolute; bottom: -18px; right: -18px; background: var(--yellow); border-radius: 16px; padding: 18px 22px; text-align: center; box-shadow: 0 6px 20px rgba(255,208,70,0.4); }
    .about-stamp-num { font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 700; color: var(--navy); }
    .about-stamp-label { font-size: 11px; color: var(--navy); opacity: .7; }
    .about-text h2 { font-size: 26px; font-weight: 900; margin-bottom: 16px; line-height: 1.35; }
    .about-text p { color: var(--gray); margin-bottom: 14px; font-size: 15px; }
    .about-values { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 28px; }
    .value-item { display: flex; align-items: flex-start; gap: 12px; padding: 16px; background: white; border-radius: 14px; border: 2px solid var(--gray-light); }
    .value-icon { font-size: 24px; }
    .value-label { font-size: 14px; font-weight: 700; }
    .value-desc { font-size: 12px; color: var(--gray); margin-top: 2px; }

    /* DEPARTMENTS */
    #departments { background: var(--white); }
    .dept-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
    .dept-card { background: var(--cream); border-radius: var(--radius); padding: 26px 18px; text-align: center; border: 2px solid transparent; transition: all .25s; cursor: pointer; }
    .dept-card:hover { border-color: var(--orange); background: white; transform: translateY(-5px); box-shadow: var(--shadow); }
    .dept-card img { width:72px;height:72px;object-fit:cover;border-radius:12px;margin:0 auto 12px;display:block; }
    .dept-emoji { font-size: 40px; margin-bottom: 12px; display: block; }
    .dept-name { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
    .dept-sub { font-size: 12px; color: var(--gray); }
    .dept-time { font-size: 12px; color: var(--orange); font-weight: 600; margin-top: 10px; }

    /* DOCTORS */
    #doctors { background: var(--yellow-pale); }
    .doc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
    .doc-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,0.06); transition: transform .25s, box-shadow .25s; }
    .doc-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); }
    .doc-card { cursor: pointer; }
    .doc-img { height: 190px; display: flex; align-items: center; justify-content: center; font-size: 80px; position: relative; }
    .doc-img.c1 { background: linear-gradient(145deg,#FFE0B2,#FFCC80); }
    .doc-img.c2 { background: linear-gradient(145deg,#B2EBF2,#80DEEA); }
    .doc-img.c3 { background: linear-gradient(145deg,#C8E6C9,#A5D6A7); }
    .doc-dept-badge { position: absolute; top: 12px; right: 12px; background: var(--orange); color: white; font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 700; }
    .doc-info { padding: 18px 20px; }
    .doc-name { font-size: 17px; font-weight: 900; margin-bottom: 3px; }

    .doc-spec span { background: var(--yellow-pale); color: var(--orange); font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; }

    #notice { background: var(--white); }
    .notice-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    .notice-col { background: var(--cream); border-radius: 20px; padding: 28px; }
    .notice-col h3 { font-size: 17px; font-weight: 900; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 2.5px dashed var(--orange); }
    .notice-list { list-style: none; }
    .notice-item { padding: 12px 0; border-bottom: 1px solid var(--gray-light); display: flex; align-items: flex-start; gap: 10px; }
    .notice-item:last-child { border-bottom: none; }
    .notice-badge { background: var(--orange); color: white; font-size: 10px; padding: 2px 7px; border-radius: 6px; font-weight: 700; white-space: nowrap; flex-shrink: 0; margin-top: 2px; }
    .notice-badge.event { background: var(--mint); color: var(--navy); }
    .notice-body { flex: 1; }
    .notice-text { font-size: 14px; }

    #reservation { background: var(--yellow-pale); }
    .resv-wrap { display: grid; grid-template-columns: 1fr 1.2fr; gap: 56px; align-items: start; }
    .resv-info h3 { font-size: 22px; font-weight: 900; margin-bottom: 14px; }
    .resv-info p { font-size: 14px; color: var(--gray); margin-bottom: 24px; line-height: 1.8; }
    .resv-hours { background: white; border-radius: 16px; padding: 24px; border: 2px solid var(--gray-light); }
    .resv-hours h4 { font-size: 14px; font-weight: 700; margin-bottom: 14px; color: var(--orange); }
    .hour-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed var(--gray-light); font-size: 14px; }
    .hour-row:last-child { border-bottom: none; }
    .hour-closed { color: #EF4444; font-weight: 600; }
    .phone-box { margin-top: 16px; padding: 14px 16px; background: var(--orange); border-radius: 12px; color: white; font-size: 14px; font-weight: 700; }
    .resv-form { background: white; border-radius: 20px; padding: 36px; box-shadow: 0 6px 32px rgba(255,122,47,0.10); }
    .form-row { margin-bottom: 18px; }
    .form-label { font-size: 14px; font-weight: 600; margin-bottom: 7px; display: block; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 12px 16px; border: 2px solid var(--gray-light); border-radius: 10px; font-family: inherit; font-size: 14px; color: var(--navy); transition: border-color .2s; outline: none; background: var(--white); }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--orange); }
    .form-textarea { resize: vertical; min-height: 90px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-submit { width: 100%; padding: 15px; background: var(--orange); color: white; border: none; border-radius: 28px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; transition: all .2s; box-shadow: 0 6px 20px rgba(255,122,47,0.35); }
    .form-submit:hover { background: var(--orange-light); transform: translateY(-1px); }

<section id="reservation">
  <div class="sec-inner">
    <div class="sec-head fade-in">
      <div class="sec-eyebrow">온라인 예약</div>
      <h2 class="sec-title">편하게 예약하세요 🦕</h2>
      <p class="sec-desc">24시간 온라인 접수 가능 · 당일 예약도 OK</p>
    </div>
    <div class="resv-wrap">
      <!-- 왼쪽: 안내 + 진료시간 -->
      <div class="fade-in">
        <div class="resv-info">
          <h3>진료 예약 안내</h3>
          <p>온라인 예약 접수 후 담당자가 확인 연락을 드립니다.<br>발열·응급 증상의 경우 전화 예약을 이용해 주세요.</p>
        </div>
        <div class="resv-hours">
          <h4>🕘 진료 시간</h4>
          <div class="hour-row"><span>월요일 – 금요일</span><span>09:00 – 18:00</span></div>
          <div class="hour-row"><span>토요일</span><span>09:00 – 13:00</span></div>
          <div class="hour-row"><span>일요일 · 공휴일</span><span class="hour-closed">휴진</span></div>
          <div class="hour-row"><span>점심시간</span><span>12:30 – 13:30</span></div>
          <a href="tel:053-000-0000" class="phone-box" style="text-decoration:none;display:flex;align-items:center;gap:8px;justify-content:center;">📞 대표 전화 : 053-000-0000 <span style="font-size:11px;opacity:.8">(탭하여 전화연결)</span></a>
        </div>
      </div>

      <!-- 오른쪽: 예약 폼 -->
      <div class="resv-form fade-in" style="transition-delay:.15s">

        <!-- 이름 + 생년월일 -->
        <div class="form-row">
          <div class="form-grid">
            <div><label class="form-label">아이 이름 *</label>
              <input class="form-input" id="rf_name" type="text" placeholder="홍길동"/></div>
            <div><label class="form-label">생년월일 *</label>
              <input class="form-input" id="rf_birth" type="text" placeholder="YYYY-MM-DD"/></div>
          </div>
        </div>

        <!-- 연락처 -->
        <div class="form-row">
          <label class="form-label">보호자 연락처 *</label>
          <input class="form-input" id="rf_phone" type="tel" placeholder="010-0000-0000"/>
        </div>

        <!-- 진료항목 + 희망날짜 (캘린더) -->
        <div class="form-row">
          <div class="form-grid">
            <div>
              <label class="form-label">진료 항목 *</label>
              <select class="form-select" id="rf_dept">
                <option value="">선택하세요</option>
                <option>호흡기 (감기·독감)</option>
                <option>열·감염 질환</option>
                <option>예방접종</option>
                <option>성장·발달 상담</option>
                <option>신생아 진료</option>
                <option>알레르기·아토피</option>
                <option>영유아 건강검진</option>
                <option>소아신경·행동 클리닉</option>
                <option>기타</option>
              </select>
            </div>
            <div>
              <label class="form-label">희망 날짜 *</label>
              <div style="position:relative">
                <input class="form-input" id="rf_date" type="text" placeholder="날짜를 선택하세요" readonly
                  style="cursor:pointer;background:white"
                  onclick="toggleCal()"/>
                <!-- 캘린더 팝업 -->
                <div id="calPopup" style="display:none;position:absolute;top:110%;left:0;z-index:300;
                  background:white;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,0.15);
                  padding:16px;width:280px;border:2px solid var(--gray-light)">
                  <!-- 캘린더 헤더 -->
                  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">

const _load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };

/* ── 병원 기본 정보 반영 ── */

  ];
  const notices = _load('dino_notices') || defaultNotices;

  const cols = document.querySelectorAll('#notice .notice-col');
  const nList = cols[0] ? cols[0].querySelector('.notice-list') : null;
  const eList = cols[1] ? cols[1].querySelector('.notice-list') : null;

    const hasDetail = n.body || (n.media && n.media.length);

  if (eList) eList.innerHTML = evn.length ? evn.map(n=>mkRow(n,'이벤트')).join('') : '<li style="padding:12px 0;color:var(--gray);font-size:14px">등록된 이벤트가 없습니다</li>';
}

/* ── 진료과 반영 ── */
function applyDepts() {

    {id:5,img:'',name:'신생아 진료',sub:'신생아 건강검진·황달',time:'월–금 09:00–17:00'},

/* ── 진료 시간 반영 ── */
function applyHours() {
  const hours = _load('dino_hours');
  const lunch = _load('dino_lunch');
  const rows = document.querySelectorAll('.hour-row');
  if (!hours || !rows.length) return;
  const openDays = hours.filter(h => h.open);
  rows.forEach((row, i) => {
    if (i < openDays.length) {
      row.children[0].textContent = openDays[i].day;
      row.children[1].textContent = openDays[i].start + ' – ' + openDays[i].end;
    }
  });
  if (lunch) {
    const lRow = Array.from(rows).find(r => r.children[0].textContent.includes('점심'));
    if (lRow) lRow.children[1].textContent = lunch.start + ' – ' + lunch.end;
  }
}

  '2026-09-24':1,'2026-09-25':1,'2026-10-03':1,'2026-10-09':1,'2026-12-25':1
};
let calYear, calMonth, calSelected = null;

function initCal() {
  const t = new Date(); calYear = t.getFullYear(); calMonth = t.getMonth(); renderCal();
}
function toggleCal() {
  const pop = document.getElementById('calPopup');
  if (!pop) return;
  const isHidden = pop.style.display === 'none' || pop.style.display === '';
  if (isHidden) { pop.style.display = 'block'; initCal(); setTimeout(() => document.addEventListener('click', outsideCalClick), 10); }
  else pop.style.display = 'none';
}
function outsideCalClick(e) {
  const pop = document.getElementById('calPopup');
  const inp = document.getElementById('rf_date');
  if (pop && !pop.contains(e.target) && e.target !== inp) {
    pop.style.display = 'none';
    document.removeEventListener('click', outsideCalClick);
  }
}
function changeMonth(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  renderCal();
}
function p2(n) { return String(n).padStart(2, '0'); }
function renderCal() {
  const today = new Date(); today.setHours(0,0,0,0);
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calTitle').textContent = calYear + '년 ' + months[calMonth];
  const grid = document.getElementById('calGrid');
  if (!grid) return;
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const lastDate = new Date(calYear, calMonth+1, 0).getDate();
  let rows = '';
  for (let i = 0; i < firstDay; i++) rows += '<div></div>';
  for (let d = 1; d <= lastDate; d++) {
    const ds = calYear + '-' + p2(calMonth+1) + '-' + p2(d);
    const dobj = new Date(calYear, calMonth, d);
    const dow = dobj.getDay();
    const disabled = dobj < today || dow === 0 || HOLIDAYS[ds];
    const isSat = dow === 6;
    const sel = calSelected === ds;
    let bg = 'transparent', col = 'var(--navy)', fw = '500', cur = 'pointer';
    if (sel)      { bg = 'var(--orange)'; col = 'white'; fw = '700'; }
    else if (disabled) { col = '#CCCCCC'; cur = 'default'; }
    else if (isSat)    { col = '#5C9EF5'; bg = '#EFF6FF'; }
    const clickStr = disabled ? '' : 'onclick="selectDate(\'' + ds + '\')"';
    rows += '<div ' + clickStr + ' style="text-align:center;padding:6px 2px;border-radius:8px;font-size:13px;font-weight:' + fw + ';color:' + col + ';background:' + bg + ';cursor:' + cur + '">' + d + '</div>';
  }
  grid.innerHTML = rows;
}
function selectDate(ds) {
  calSelected = ds;
  const [y, m, d] = ds.split('-');
  const el = document.getElementById('rf_date');
  el.value = y + '년 ' + parseInt(m) + '월 ' + parseInt(d) + '일';
  el.dataset.value = ds;
  document.getElementById('calPopup').style.display = 'none';
  document.removeEventListener('click', outsideCalClick);
  renderCal();
}

/* ── 예약 제출 ── */
function submitResvForm() {
  const g = id => document.getElementById(id);
  const name  = (g('rf_name')  && g('rf_name').value.trim())  || '';
  const birth = (g('rf_birth') && g('rf_birth').value.trim()) || '';
  const phone = (g('rf_phone') && g('rf_phone').value.trim()) || '';
  const dept  = (g('rf_dept')  && g('rf_dept').value)         || '';
  const dateEl = g('rf_date');
  const date  = dateEl ? (dateEl.dataset.value || '') : '';
  const note   = (g('rf_note')   && g('rf_note').value.trim())   || '';
  const doctor = (g('rf_doctor') && g('rf_doctor').value) || '상관없음';
  if (!name)  { alert('아이 이름을 입력해주세요');   g('rf_name').focus();  return; }
  if (!phone) { alert('보호자 연락처를 입력해주세요'); g('rf_phone').focus(); return; }
  if (!dept)  { alert('진료 항목을 선택해주세요');   g('rf_dept').focus();  return; }
  if (!date)  { alert('희망 날짜를 선택해주세요'); return; }
  const btn = document.querySelector('#reservation .form-submit');
  if (btn) { btn.textContent = '⏳ 접수 중...'; btn.disabled = true; }
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const receivedAt = now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes());
  const payload = { name, birth, phone, dept, doctor, date, note, receivedAt };
  const gasUrl = 'https://script.google.com/macros/s/AKfycbyAIQ11fv-UtPZYuq4cBrrMnYQB1z1xUJympipj63cnM0qJm1heUgTW5fXcIszDSXmXfw/exec';
  fetch(gasUrl, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) }).catch(()=>{});
  const resvs = _load('dino_resvs') || [];
  resvs.push(Object.assign({ id: Date.now(), status: 'new' }, payload));
  localStorage.setItem('dino_resvs', JSON.stringify(resvs));
  ['rf_name','rf_birth','rf_phone','rf_note'].forEach(id => { const el=g(id); if(el) el.value=''; });
  if (dateEl) { dateEl.value=''; dateEl.dataset.value=''; }
  const deptEl = g('rf_dept'); if (deptEl) deptEl.selectedIndex = 0;
  const docEl = g('rf_doctor'); if (docEl) docEl.selectedIndex = 0;
  calSelected = null;
  if (btn) { btn.textContent = '🦕 예약 신청하기'; btn.disabled = false; }
  openModal();
}

function bookWithDoctor(btn) {
  // 현재 모달에 표시된 의사 이름 읽기
  const docName = document.getElementById('dmName').textContent || '';
  closeDocModal();
  // 예약 섹션으로 스크롤
  const resvSection = document.getElementById('reservation');
  if (resvSection) {
    setTimeout(function() {
      resvSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
  // 희망 원장 드롭다운 자동 설정
  setTimeout(function() {
    const doctorSelect = document.getElementById('rf_doctor');
    if (!doctorSelect || !docName) return;
    const options = doctorSelect.options;
    for (var i = 0; i < options.length; i++) {
      if (options[i].value === docName) {
        doctorSelect.selectedIndex = i;
        // 선택된 항목 하이라이트
        doctorSelect.style.borderColor = 'var(--orange)';
        doctorSelect.style.background = 'var(--yellow-pale)';
        setTimeout(function() {
          doctorSelect.style.borderColor = '';
          doctorSelect.style.background = '';
        }, 2000);
        break;
      }
    }
  }, 500);
}


/* ── 병원 사진 슬라이드쇼 ── */
var _slideIdx = 0;
var _slideTimer = null;
var _slideImgs = [];

function initSlideshow() {
  var stored = _load('dino_about_imgs');
  // 기본 이미지 (병원 외관 사진 base64가 있으면 사용, 없으면 이모지)
  _slideImgs = (stored && stored.length) ? stored : [];
  renderSlideshow();
  startSlideAuto();
}

function renderSlideshow() {
  var track  = document.getElementById('slideTrack');
  var thumbs = document.getElementById('slideThumbs');
  var counter= document.getElementById('slideCounter');
  if (!track) return;

  if (!_slideImgs.length) {
    track.innerHTML = '<div class="slide-item"><div class="slide-empty">🏥</div></div>';
    thumbs.innerHTML = '';
    if (counter) counter.textContent = '';
    return;
  }

  track.innerHTML = _slideImgs.map(function(src, i) {
    return '<div class="slide-item"><img src="' + src + '" alt="병원사진' + (i+1) + '"/></div>';
  }).join('');

  thumbs.innerHTML = _slideImgs.map(function(src, i) {
    return '<div class="slide-thumb' + (i===_slideIdx?' active':'') + '" onclick="goSlide(' + i + ')">' +
      '<img src="' + src + '" alt="thumb"/></div>';
  }).join('');

  if (counter) counter.textContent = (_slideIdx+1) + ' / ' + _slideImgs.length;

  track.style.transform = 'translateX(-' + (_slideIdx * 100) + '%)';
}

function goSlide(idx) {
  if (!_slideImgs.length) return;
  _slideIdx = (idx + _slideImgs.length) % _slideImgs.length;
  var track  = document.getElementById('slideTrack');
  var thumbs = document.getElementById('slideThumbs');
  var counter= document.getElementById('slideCounter');
  if (track)  track.style.transform  = 'translateX(-' + (_slideIdx * 100) + '%)';
  if (counter) counter.textContent   = (_slideIdx+1) + ' / ' + _slideImgs.length;
  if (thumbs) {
    thumbs.querySelectorAll('.slide-thumb').forEach(function(t, i) {
      t.classList.toggle('active', i === _slideIdx);
    });
  }
}

function slideNext() { goSlide(_slideIdx + 1); resetSlideAuto(); }
function slidePrev() { goSlide(_slideIdx - 1); resetSlideAuto(); }

function startSlideAuto() {
  if (_slideTimer) clearInterval(_slideTimer);
  if (_slideImgs.length > 1) {
    _slideTimer = setInterval(function() { goSlide(_slideIdx + 1); }, 3000);
  }
}
function resetSlideAuto() {
  if (_slideTimer) clearInterval(_slideTimer);
  startSlideAuto();
}

function showNoticeDetail(id) {
  const notices = _load('dino_notices') || [];
  const n = notices.find(x => x.id === id);
  if (!n) return;
  let html2 = '<div style="position:fixed;inset:0;z-index:800;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;padding:20px" id="noticeModal" onclick="if(event.target.id===\'noticeModal\')this.remove()">';
  html2 += '<div style="background:white;border-radius:20px;padding:32px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto;position:relative">';
  html2 += '<button onclick="document.getElementById(\'noticeModal\').remove()" style="position:absolute;top:14px;right:14px;background:var(--gray-light);border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px">✕</button>';
  html2 += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">';
  html2 += '<span style="background:' + (n.type==='이벤트'?'var(--mint)':'var(--orange)') + ';color:' + (n.type==='이벤트'?'var(--navy)':'white') + ';font-size:11px;padding:3px 9px;border-radius:6px;font-weight:700">' + n.type + '</span>';
  html2 += '<h3 style="font-size:18px;font-weight:900;margin:0">' + n.text + '</h3></div>';
  html2 += '<div style="font-size:12px;color:var(--gray);margin-bottom:16px">' + n.date + '</div>';
  if (n.body) html2 += '<div style="font-size:14px;color:var(--gray);line-height:1.8;white-space:pre-wrap;margin-bottom:16px">' + n.body + '</div>';
  if (n.media && n.media.length) {
    n.media.forEach(function(m) {
      if (m.type === 'video') {
        html2 += '<video src="' + m.src + '" controls style="max-width:100%;border-radius:10px;margin-bottom:10px;display:block"></video>';
      } else {
        html2 += '<img src="' + m.src + '" style="max-width:100%;border-radius:10px;margin-bottom:10px;display:block"/>';
      }
    });
  }
  html2 += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html2);
}

const observer = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.1 });
document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

if ('serviceWorker' in navigator) {
  // 기존 SW 캐시 전체 삭제 후 재등록
  caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
  window.addEventListener('load', () => {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(reg => reg.unregister());
    }).then(() => {
      navigator.serviceWorker.register('/dinohospital/sw.js')
        .then(reg => console.log('SW 등록 완료:', reg.scope))
        .catch(err => console.log('SW 등록 실패:', err));
    });
  });
}
